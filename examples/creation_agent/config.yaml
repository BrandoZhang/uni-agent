# Agent-loop config for the multimodal creation agent (UniAgentLoop path).
#
# This wires the SAME media tools + skill + cost-aware reward used by the
# standalone `demo.py` into `uni_agent.agent_loop.UniAgentLoop`, i.e. the
# large-scale / RL-training entrypoint. `demo.py` itself does NOT read this
# file (it drives `AgentInteraction` directly and takes its endpoint from
# env vars); this config is the bridge to running the same agent under the
# parallel inference / training stack.
#
# The media tools default to the offline mock backend. For real generation,
# set MEDIA_BACKEND=volc and ARK_API_KEY in `env.env_variables` below.
- name: creation_agent

  _target_: uni_agent.agent_loop.UniAgentLoop

  concurrency: 64
  log_dir: /tmp/creation_agent
  mask_abnormal_exit_traj: false

  interaction:
    # NOTE (real volc backend): a wait=True video call blocks while the CLI
    # polls Ark for up to ARK_POLL_TIMEOUT (default 900s). If action_timeout is
    # shorter, the harness kills the tool mid-poll; the CLI now cancels the
    # in-flight Ark task on SIGTERM/SIGINT so it isn't orphaned/billed, but you
    # still lose the clip. For real video either raise action_timeout to exceed
    # ARK_POLL_TIMEOUT, or have the agent submit with wait=false and poll via
    # video_task. The mock backend is synchronous, so 180 is fine for the demo.
    action_timeout: 180
    max_turns: 30
    chat_mode: false          # single-shot task (brief -> film), end on `finish`

  env:
    deployment:
      type: local_native      # pexpect bash on the host; no container, no GPU
    env_variables:
      MEDIA_BACKEND: mock      # set to `volc` for the real Ark API
      # Per-run workspace isolation: UniAgentLoop derives the effective
      # workspace as <MEDIA_WORKSPACE_BASE>/<workspace_key>, keyed by this
      # run's run_id (or a stable MEDIA_WORKSPACE_KEY the caller pins for a
      # resumable session). It sets MEDIA_WORKSPACE + MEDIA_USAGE_LOG under
      # that dir and cds the shell into it, so the `concurrency: 64` rollouts
      # here never collide on artifacts or the cost ledger on the shared host
      # FS. (Pin a static MEDIA_WORKSPACE instead to opt out.)
      MEDIA_WORKSPACE_BASE: /tmp/creation_agent/workspace
      # MEDIA_WORKSPACE_KEY: "<stable-session-id>"  # only for resumable sessions
      # Reclaim <base>/<run_id> at run end (after the reward). Off by default;
      # on here because a 64-way training run would otherwise pile up artifacts.
      # Deletion runs through the env (rm -rf inside the sandbox), so it's
      # correct for both a container FS and this shared host FS; a container
      # backend reclaims the FS at close() anyway, making this a no-op there.
      # NOTE: it also removes a *failed* run's artifacts — turn it off if you
      # need to inspect them. Never touches a session-keyed (resumable) dir.
      MEDIA_WORKSPACE_GC: reclaim
      # ARK_API_KEY: "<your-ark-key>"        # required when MEDIA_BACKEND=volc
      # ARK_IMAGE_MODEL: "doubao-seedream-4-0-250828"
      # ARK_VIDEO_MODEL: "doubao-seedance-1-0-pro-250528"

  # Structured (OpenAI) tool calls come back from the serving model; the
  # parser only matters for text-format models. hermes/qwen3_coder both work.
  tool_parser: qwen3_coder

  # The media tools are `media-ai` console scripts (system tools): the runtime
  # must have `pip install "git+https://github.com/BrandoZhang/media-ai"` so
  # they're on PATH. execute_bash / str_replace_editor / finish are copied in.
  tools:
    - name: execute_bash
    - name: str_replace_editor
    - name: text2image
    - name: image2image
    - name: text2video
    - name: image2video
    - name: ref2video
    - name: concat_video
    - name: video_task
    - name: media_usage
    - name: finish

  skills:
    skills_dir: skills         # repo-root skills/ dir holds video-storyboard/

  reward:
    name: media_creation
    cost_weight: 0.0001        # reward = quality_proxy - cost_weight * total_tokens
    # `workspace` is the fallback dir the reward probes for the final film when
    # the trajectory names none. When per-run isolation is on (MEDIA_WORKSPACE_BASE
    # above), UniAgentLoop overrides this with the resolved <base>/<run_id> so the
    # probe matches where this run actually wrote. It only matters if you opt out
    # of isolation (pin a static MEDIA_WORKSPACE instead).
    workspace: /tmp/creation_agent/workspace
